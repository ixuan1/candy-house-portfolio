<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 糖果迷路了</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Inter",system-ui,sans-serif;background:#F5F5F0;color:#0A0A0A;
    min-height:100vh;display:grid;place-items:center;padding:24px;
  }
  .box{
    background:#FFE3F1;border:3px solid #000;box-shadow:8px 8px 0 #000;border-radius:14px;
    padding:40px 44px;max-width:460px;text-align:center;
  }
  .code{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:5rem;line-height:1;}
  .code span{background:#FF1493;color:#fff;padding:0 .1em;border:3px solid #000;box-shadow:5px 5px 0 #000;display:inline-block;transform:rotate(-3deg);}
  h1{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:1.5rem;margin:14px 0 8px;}
  p{margin-bottom:22px;}
  .btn{display:inline-block;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;padding:12px 24px;border:3px solid #000;border-radius:14px;background:#FFE135;box-shadow:5px 5px 0 #000;color:#0A0A0A;text-decoration:none;transition:transform .1s,box-shadow .1s;}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #000;}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 #000;}
</style>
</head>
<body>
  <div class="box">
    <div class="code"><span>404</span></div>
    <h1>这颗糖找不到了</h1>
    <p>你访问的页面可能已经下架，或者地址打错了。回糖果屋主页再挑一颗吧。</p>
    <a class="btn" href="/">← 回到糖果屋</a>
  </div>
</body>
</html>
