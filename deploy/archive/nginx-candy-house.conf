# ============================================================
#  裸机 Nginx 参考配置（systemd 作业用，对应 ops-guide.md 第 11 节）
#  与 Docker 版区别：没有 Docker 内置 DNS，upstream 直接写本机 IP:端口。
#  放置：/etc/nginx/conf.d/candy-house.conf  （Ubuntu 也可 sites-available + 软链）
#  校验：sudo nginx -t   生效：sudo systemctl reload nginx
#  前提：后端由 systemd 跑在 127.0.0.1:8000（可起 2 个实例做 LB）
# ============================================================

server {
    listen 80;
    server_name _;

    root /opt/candy-house-portfolio/static;     # 静态前端目录
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # 反向代理 + 负载均衡（裸机：写死后端地址）
    # 起 2 个 systemd 实例(8000/8001) 时，在这里加一行 server 即可
    upstream candy_app_upstream {
        least_conn;
        server 127.0.0.1:8000;
        # server 127.0.0.1:8001;   # 扩容时取消注释
    }

    location /api/ {
        proxy_pass http://candy_app_upstream;   # 不加尾斜杠，保留 /api 前缀
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /docs         { proxy_pass http://candy_app_upstream; }
    location /redoc        { proxy_pass http://candy_app_upstream; }
    location /openapi.json { proxy_pass http://candy_app_upstream; }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
