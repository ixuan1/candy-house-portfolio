# ============================================================
#  糖果屋 · Nginx 配置（反向代理 + 负载均衡 + 静态）
#  角色：最前端的“大门”。用户只访问 80 端口，
#        - 静态页（index/admin/debug）直接发文件
#        - /api/* 转给后端的多个 FastAPI 容器（负载均衡）
#        - /docs /redoc /openapi.json 也转给后端，方便调试
#  放入容器：/etc/nginx/conf.d/default.conf
# ============================================================

# Docker 内置 DNS（127.0.0.11）。写了 resolver 后，
# nginx 会周期性重新解析 app 这个服务名，
# 这样你 docker compose up --scale app=2 扩容后，
# 不用重启 nginx 也能把流量分到新容器。
resolver 127.0.0.11 valid=10s ipv6=off;

# 负载均衡上游：多个 app 容器都叫 app（compose 扩容后的副本）
# least_conn = 把请求发给“当前连接最少”的节点，比纯轮询更均衡
upstream candy_app_upstream {
    least_conn;
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # ---------- 静态前端 ----------
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # ---------- 后端 API（反向代理 + 负载均衡）----------
    location /api/ {
        proxy_pass http://candy_app_upstream;   # 不加尾斜杠，保留 /api 前缀原样转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 探活用：后端挂了，nginx 很快就把这台摘掉
        proxy_next_upstream error timeout http_502 http_503;
    }

    # ---------- 调试三件套（FastAPI 自带）----------
    location /docs        { proxy_pass http://candy_app_upstream; }
    location /redoc       { proxy_pass http://candy_app_upstream; }
    location /openapi.json { proxy_pass http://candy_app_upstream; }

    # ---------- 静态资源缓存 ----------
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
