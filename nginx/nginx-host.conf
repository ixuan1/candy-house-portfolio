# ============================================================
#  糖果屋 · 宿主机 Nginx 配置（不用 Docker 跑 Nginx 时用这份）
#
#  放法（在京东云服务器上，Ubuntu/Debian 发行版）：
#    sudo cp nginx/nginx-host.conf /etc/nginx/sites-available/candy-house.conf
#    sudo ln -sf /etc/nginx/sites-available/candy-house.conf /etc/nginx/sites-enabled/candy-house.conf
#    sudo rm -f /etc/nginx/sites-enabled/default        # 删默认站点，否则还是 Nginx 欢迎页
#    sudo nginx -t && sudo nginx -s reload
#
#  ⚠️ 京东云是 Ubuntu，Nginx 默认【不读 /etc/nginx/conf.d/】，只认 sites-enabled/。
#     直接丢进 conf.d 会静默不生效 → 访问全是 404（糖果屋的「祖传 404 坑」）。
#     CentOS/RHEL 才用 conf.d，注意区分。
#
#  要点：
#    1) 静态文件直接由宿主机 Nginx 从 /opt/candy-house-portfolio/static 读，
#       不进容器，最快。
#    2) /api/ 反代到 Docker 里的 FastAPI；upstream 用 127.0.0.1 指向宿主机
#       映射出来的 8000/8001 端口，least_conn 做负载均衡。
#    3) 8000/8001 只在宿主机回环监听，外网打不到，安全面小。
# ============================================================

upstream candy_app_upstream {
    least_conn;                       # 最少连接优先
    server 127.0.0.1:8000;           # 第 1 个 app 容器映射的端口
    server 127.0.0.1:8001;           # 第 2 个 app（docker compose up --scale app=2）
    # 若只跑 1 个 app，把这行删掉即可（或保留，nginx 会自动跳过连不上的）
}

server {
    listen 80 default_server;
    server_name _;                    # 没绑域名时填 _，有域名改成你的域名

    # ---- 静态资源（展示页 / 管理页 / 调试页）----
    root /opt/candy-house-portfolio/static;
    index index.html;

    # 安全基线：隐藏 Nginx 版本号
    server_tokens off;

    # 静态文件缓存（图片/字体/JS/CSS）
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由回退：访问 /admin.html、/debug.html、/ 都能正确命中
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反向代理到 Docker 里的 FastAPI ----
    location /api/ {
        proxy_pass http://candy_app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 某后端 502/503 时自动转给下一台，用户无感
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- 调试面板 / 自动文档（FastAPI 自带）----
    location /docs {
        proxy_pass http://candy_app_upstream/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://candy_app_upstream/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://candy_app_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # 自定义 404（沿用主题错误页）
    error_page 404 /404.html;
    location = /404.html {
        root /opt/candy-house-portfolio/static;
        internal;
    }
}
